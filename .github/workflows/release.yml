name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    name: Build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: twfarmer
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: twfarmer.exe
          - os: macos-14
            target: aarch64-apple-darwin
            binary: twfarmer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag
        run: python scripts/package_release.py --check-tag
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release
        run: python scripts/package_release.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and combine checksums
        shell: bash
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm -- *.sha256
      - name: Create draft with all archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "TwFarmer $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
