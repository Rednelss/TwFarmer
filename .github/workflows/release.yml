name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name != 'release' || !(
        contains(github.event.release.assets.*.name, 'SHA256SUMS') &&
        contains(github.event.release.assets.*.name, format('twfarmer-{0}-x86_64-unknown-linux-gnu.tar.gz', github.ref_name)) &&
        contains(github.event.release.assets.*.name, format('twfarmer-{0}-x86_64-pc-windows-msvc.zip', github.ref_name)) &&
        contains(github.event.release.assets.*.name, format('twfarmer-{0}-aarch64-apple-darwin.tar.gz', github.ref_name))
      )
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    name: Build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: twfarmer
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: twfarmer.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: twfarmer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag
        run: python scripts/package_release.py --check-tag
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release
        run: python scripts/package_release.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and combine checksums
        shell: bash
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm -- *.sha256
      - name: Upload assets or create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          english = Path('packaging/RELEASE_NOTES.md').read_text(encoding='utf-8')
          russian = Path('packaging/RELEASE_NOTES.ru.md').read_text(encoding='utf-8')
          Path(os.environ['RUNNER_TEMP'], 'twfarmer-release-notes.md').write_text(
              '## English\n\n' + english + '\n## Русский\n\n' + russian,
              encoding='utf-8',
          )
          PY
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "TwFarmer $RELEASE_TAG" --notes-file "$RUNNER_TEMP/twfarmer-release-notes.md"
          fi
