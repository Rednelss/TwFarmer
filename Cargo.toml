[package]
name = "twfarmer"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal Twitch channel points and Drops farmer with multiple accounts"
license = "MIT"
repository = "https://github.com/Rednelss/TwFarmer"
readme = "README.md"
keywords = ["twitch", "cli", "tui", "channel-points"]
categories = ["command-line-utilities"]
publish = false

[profile.release]
strip = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
flate2 = "1"
semver = "1"
self-replace = "1.5"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
