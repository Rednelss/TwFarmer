[package]
name = "twfarmer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Консольный клиент Twitch для баллов выбранных каналов"
license = "MIT"
repository = "https://github.com/Rednelss/TwFarmer"
readme = "README.md"
keywords = ["twitch", "cli", "tui", "channel-points"]
categories = ["command-line-utilities"]
publish = false

[profile.release]
strip = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
